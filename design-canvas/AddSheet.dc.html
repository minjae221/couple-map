<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Wanted Sans Variable', 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; }
    a { color: #e11d48; } a:hover { color: #be123c; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #eae6df; color: #1c1917;">
  <!-- 뒤: 흐린 지도 -->
  <div style="position: absolute; top: 120px; left: -40px; width: 220px; height: 180px; border-radius: 48% 52% 55% 45%; background: #d9e7d3;"></div>
  <div style="position: absolute; top: 0; left: 150px; width: 14px; height: 100%; background: #ffffff; transform: rotate(12deg);"></div>

  <!-- 딤 -->
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(74,63,53,0.42);"></div>

  <!-- 추억 추가 시트 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: rgba(251,250,249,0.86); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid rgba(255,255,255,0.75); padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.02em; margin-bottom: 8px;">추억 남기기</div>

    <div style="font-size: 12px; font-weight: 600; color: #8a8580; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 2px 4px;">장소 이름</div>
    <div style="border-radius: 14px; border: 1px solid rgba(28,25,23,0.1); background: #ffffff; padding: 11px 12px; font-size: 15px;">성수동 카페 온도</div>

    <div style="font-size: 12px; font-weight: 600; color: #8a8580; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 2px 4px;">다녀온 날</div>
    <div style="border-radius: 14px; border: 1px solid rgba(28,25,23,0.1); background: #ffffff; padding: 11px 12px; font-size: 15px;">2026-09-06</div>

    <div style="font-size: 12px; font-weight: 600; color: #8a8580; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 2px 4px;">한 줄 기록</div>
    <div style="border-radius: 14px; border: 1px solid rgba(28,25,23,0.1); background: #ffffff; padding: 11px 12px; font-size: 15px; color: #8a8580;">그날의 한 줄</div>

    <div style="font-size: 12px; font-weight: 600; color: #8a8580; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 2px 4px;">사진</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px;">
      <div style="width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #f6d5cf, #e7c8ec); box-shadow: 0 8px 32px rgba(28,25,23,0.09);"></div>
      <div style="width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(135deg, #cfe3f6, #d3ecd9); box-shadow: 0 8px 32px rgba(28,25,23,0.09);"></div>
      <div style="width: 64px; height: 64px; border-radius: 14px; border: 1.5px dashed rgba(28,25,23,0.25); color: #8a8580; display: flex; align-items: center; justify-content: center; font-size: 22px;">+</div>
    </div>

    <div style="margin-top: 16px; border-radius: 999px; background: #1c1917; color: #ffffff; font-weight: 700; font-size: 15px; text-align: center; padding: 14px 16px;">이 곳을 우리 지도에 ♥</div>
    <div style="margin-top: 8px; border-radius: 999px; background: rgba(28,25,23,0.06); color: #1c1917; font-weight: 700; font-size: 15px; text-align: center; padding: 14px 16px;">취소</div>
  </div>
</div>
</x-dc>
</body>
</html>
