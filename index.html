<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>우리의 지도</title>
<meta name="theme-color" content="#fff7ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
/* 하트 클러스터 (핀 뭉침) */
.heart-cluster{
  background:var(--rose);color:#fff;border:3px solid var(--white);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--hand);
  font-size:1.05rem;box-shadow:0 4px 10px rgba(217,93,109,.45);
}
</style>
<style>
:root{
  --paper:#fff7ee; --paper-deep:#ffefe2; --ink:#5b4a40; --ink-soft:#a08b7c;
  --rose:#ff8fa3; --rose-deep:#f26d85; --sage:#7fc8a9; --lav:#c9b8f0; --white:#ffffff;
  --shadow:0 8px 22px rgba(242,109,133,.14);
  --hand:'Jua',sans-serif; --body:'Gowun Dodum',sans-serif;
  --squish:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:var(--body);color:var(--ink);
  background:linear-gradient(180deg,#fff7ee 0%,#fff0e6 55%,#ffe8dc 100%);
  display:flex;flex-direction:column;position:fixed;inset:0;
}
/* 몽글 blob 배경 */
body::before{
  content:"";position:fixed;width:340px;height:340px;z-index:-1;
  border-radius:46% 54% 58% 42%/52% 44% 56% 48%;
  background:radial-gradient(circle at 35% 35%,#ffd8e1,#ffc7d4);
  top:-130px;right:-110px;opacity:.55;filter:blur(4px);
}
body::after{
  content:"";position:fixed;width:300px;height:300px;z-index:-1;
  border-radius:52% 48% 44% 56%/48% 55% 45% 52%;
  background:radial-gradient(circle at 40% 40%,#e8dffb,#d9cdf6);
  bottom:-120px;left:-100px;opacity:.5;filter:blur(6px);
}
/* ── header ─────────────────────────────── */
header{
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;text-align:center;position:relative;z-index:500;
  background:linear-gradient(var(--paper) 75%,transparent);
}
header h1{font-family:var(--hand);font-size:1.9rem;line-height:1.1;letter-spacing:.02em}
header h1 .amp{color:var(--rose);padding:0 .15em}
#dday{font-family:var(--hand);font-size:1.15rem;color:var(--rose-deep);margin-top:-2px}
#btnSettings{
  position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 12px);
  border:none;background:none;font-size:1.25rem;color:var(--ink-soft);cursor:pointer;padding:6px;
}
/* ── main panes ─────────────────────────── */
main{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
#map{width:100%;height:100%;background:var(--paper-deep)}
.leaflet-container{font-family:var(--body)}
/* heart pin */
.heart-pin svg{filter:drop-shadow(0 3px 4px rgba(74,63,53,.35));transform-origin:50% 90%;animation:pinDrop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pinDrop{from{transform:translateY(-26px) scale(.4);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
/* polaroid popup */
.leaflet-popup-content-wrapper{background:var(--white);border-radius:4px;box-shadow:var(--shadow);padding:0}
.leaflet-popup-content{margin:0;width:196px!important}
.leaflet-popup-tip{background:var(--white)}
.pol{padding:10px 10px 8px;position:relative;transform:rotate(-1.4deg)}
.pol::before{
  content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(2deg);
  width:74px;height:20px;background:rgba(224,200,150,.55);border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);
}
.pol img{width:100%;height:128px;object-fit:cover;display:block;background:var(--paper-deep)}
.pol .noimg{width:100%;height:82px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--paper-deep);color:var(--ink-soft)}
.pol h3{font-family:var(--hand);font-size:1.3rem;margin-top:7px;line-height:1.15}
.pol time{font-size:.72rem;color:var(--ink-soft)}
.pol p{font-size:.83rem;margin-top:3px;word-break:keep-all}
.pol .more{
  display:block;width:100%;margin-top:8px;border:none;background:var(--paper-deep);
  font-family:var(--hand);font-size:1.05rem;color:var(--rose-deep);padding:5px;border-radius:3px;cursor:pointer;
}
/* ── bucket pane ────────────────────────── */
#paneBucket{overflow-y:auto;padding:6px 18px calc(140px + env(safe-area-inset-bottom))}
.bucket-head{font-family:var(--hand);font-size:1.5rem;margin:10px 2px 2px;color:var(--ink)}
.bucket-head small{font-size:.95rem;color:var(--ink-soft);margin-left:8px}
#bucketList{list-style:none;margin-top:6px}
#bucketList li{
  display:flex;align-items:flex-start;gap:10px;padding:11px 4px;border-bottom:1px dashed rgba(138,125,111,.4);
  animation:fadeUp .35s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bk-check{
  flex:none;width:26px;height:26px;border:2px solid var(--rose);border-radius:50%;background:none;cursor:pointer;
  font-size:.95rem;line-height:1;color:transparent;transition:all .18s;margin-top:1px;
}
.bk-check.done{background:var(--rose);color:#fff;transform:scale(1.05)}
.bk-body{flex:1;min-width:0}
.bk-title{font-size:.97rem;word-break:keep-all;transition:color .2s}
li.done .bk-title{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--rose)}
.bk-date{font-family:var(--hand);font-size:1rem;color:var(--sage)}
.bk-pin,.bk-del{border:none;background:none;cursor:pointer;font-size:1rem;padding:3px 5px;color:var(--ink-soft)}
.bk-pin{color:var(--sage)}
#bucketEmpty{margin-top:34px;text-align:center;color:var(--ink-soft);font-family:var(--hand);font-size:1.35rem;line-height:1.6}
#bucketAdd{
  position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));display:none;gap:8px;z-index:600;
}
#bucketAdd.show{display:flex}
#bucketAdd input{
  flex:1;border:none;border-radius:24px;padding:13px 18px;font-family:var(--body);font-size:.95rem;
  background:var(--white);box-shadow:var(--shadow);outline:none;color:var(--ink);
}
#bucketAdd button{
  flex:none;width:48px;border:none;border-radius:50%;background:var(--rose);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:var(--shadow);
}
/* ── tab bar ────────────────────────────── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:700;display:flex;
  background:var(--white);box-shadow:0 -4px 16px rgba(74,63,53,.12);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;border:none;background:none;font-family:var(--hand);font-size:1.25rem;color:var(--ink-soft);
  padding:11px 0 9px;cursor:pointer;position:relative;transition:color .2s;
}
nav button.active{color:var(--rose-deep)}
nav button.active::after{
  content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:26px;height:3px;border-radius:2px;background:var(--rose);
}
/* ── FAB ────────────────────────────────── */
#fab{
  position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:650;
  width:56px;height:56px;border:none;border-radius:50%;background:var(--rose);color:#fff;
  font-size:1.9rem;line-height:1;cursor:pointer;box-shadow:0 8px 20px rgba(217,93,109,.45);
  transition:transform .18s;
}
#fab:active{transform:scale(.9)}
/* ── sheets & modals ────────────────────── */
.veil{position:fixed;inset:0;background:rgba(74,63,53,.42);z-index:800;display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{
  background:var(--paper);width:100%;max-width:520px;max-height:88%;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sheetUp .28s cubic-bezier(.2,1,.35,1) both;
}
@keyframes sheetUp{from{transform:translateY(60%)}to{transform:none}}
.sheet h2{font-family:var(--hand);font-size:1.6rem;margin-bottom:12px}
.sheet label{display:block;font-size:.8rem;color:var(--ink-soft);margin:12px 2px 4px}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=search]{
  width:100%;border:1.5px solid rgba(138,125,111,.35);border-radius:9px;background:var(--white);
  padding:11px 12px;font-family:var(--body);font-size:.95rem;color:var(--ink);outline:none;
}
.sheet input:focus{border-color:var(--rose)}
.btn{
  display:inline-block;border:none;border-radius:10px;padding:12px 16px;cursor:pointer;
  font-family:var(--hand);font-size:1.25rem;line-height:1;
}
.btn-rose{background:var(--rose);color:#fff;width:100%;margin-top:16px}
.btn-ghost{background:var(--paper-deep);color:var(--ink);width:100%;margin-top:8px}
.btn-line{background:none;border:1.5px dashed var(--ink-soft);color:var(--ink-soft);width:100%;margin-top:8px}
#searchResults{list-style:none;margin-top:8px}
#searchResults li{
  padding:10px 8px;border-bottom:1px dashed rgba(138,125,111,.35);cursor:pointer;font-size:.9rem;word-break:keep-all;
}
#searchResults li b{display:block;font-size:.95rem}
#searchResults li span{color:var(--ink-soft);font-size:.78rem}
#photoRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#photoRow .ph{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;box-shadow:var(--shadow)}
#photoRow .ph img{width:100%;height:100%;object-fit:cover}
#photoRow .ph button{
  position:absolute;top:1px;right:1px;width:20px;height:20px;border:none;border-radius:50%;
  background:rgba(74,63,53,.72);color:#fff;font-size:.7rem;cursor:pointer;line-height:1;
}
#photoAdd{
  width:64px;height:64px;border:1.5px dashed var(--ink-soft);border-radius:6px;background:none;
  color:var(--ink-soft);font-size:1.4rem;cursor:pointer;
}
/* detail modal */
.modal{
  position:fixed;inset:0;z-index:900;background:var(--paper);display:none;flex-direction:column;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(30px + env(safe-area-inset-bottom));
}
.modal.show{display:flex}
.modal .close{position:sticky;top:0;align-self:flex-end;border:none;background:var(--paper-deep);border-radius:50%;width:36px;height:36px;font-size:1rem;cursor:pointer;color:var(--ink)}
#dTitle{font-family:var(--hand);font-size:2rem;margin-top:4px}
#dMeta{font-family:var(--hand);font-size:1.15rem;color:var(--rose-deep)}
#dNote{margin-top:10px;font-size:.95rem;line-height:1.6;word-break:keep-all}
#dPhotos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
#dPhotos img{width:100%;border-radius:4px;box-shadow:var(--shadow);background:var(--white);padding:6px 6px 20px;cursor:zoom-in}
#dPhotos img:nth-child(odd){transform:rotate(-1.6deg)}
#dPhotos img:nth-child(even){transform:rotate(1.3deg)}
#dDelete{margin-top:26px;align-self:center;background:none;border:none;color:var(--ink-soft);font-size:.8rem;text-decoration:underline;cursor:pointer}
/* lightbox */
#lightbox{position:fixed;inset:0;z-index:1000;background:rgba(30,25,20,.93);display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:88%;max-height:92%;border-radius:4px}
#lbPrev,#lbNext{
  position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(247,241,229,.14);
  color:var(--paper);width:42px;height:42px;border-radius:50%;font-size:1.5rem;line-height:1;cursor:pointer;z-index:2;
}
#lbPrev{left:8px}#lbNext{right:8px}
#lbPrev.off,#lbNext.off{opacity:.25;pointer-events:none}
#lbCount{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:var(--paper);font-family:var(--hand);font-size:1.1rem;opacity:.85}
/* timeline */
#paneTimeline{overflow-y:auto;padding:8px 18px calc(96px + env(safe-area-inset-bottom))}
#tlStats{
  display:flex;gap:8px;justify-content:center;margin:8px 0 4px;font-family:var(--hand);
  font-size:1.05rem;color:var(--ink-soft);flex-wrap:wrap;
}
#tlStats span{background:var(--white);border-radius:16px;padding:5px 12px;box-shadow:var(--shadow)}
#tlStats b{color:var(--rose-deep)}
.tl-month{font-family:var(--hand);font-size:1.4rem;color:var(--rose-deep);margin:20px 2px 4px}
.tl-card{
  display:flex;gap:12px;align-items:flex-start;background:var(--white);border-radius:6px;
  box-shadow:var(--shadow);padding:10px;margin-top:10px;cursor:pointer;
  animation:fadeUp .35s both;
}
.tl-card img{width:74px;height:74px;object-fit:cover;border-radius:4px;flex:none;background:var(--paper-deep)}
.tl-card .noimg{width:74px;height:74px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--paper-deep);border-radius:4px;color:var(--ink-soft);flex:none}
.tl-card h3{font-family:var(--hand);font-size:1.3rem;line-height:1.15}
.tl-card time{font-size:.72rem;color:var(--ink-soft)}
.tl-card p{font-size:.85rem;margin-top:3px;word-break:keep-all;color:var(--ink)}
#tlEmpty{margin-top:40px;text-align:center;color:var(--ink-soft);font-family:var(--hand);font-size:1.35rem;line-height:1.6}
/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:22px;font-size:.86rem;
  opacity:0;pointer-events:none;transition:all .3s;z-index:1100;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* pick-on-map hint */
#pickHint{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:500;display:none;
  background:var(--ink);color:var(--paper);font-family:var(--hand);font-size:1.15rem;
  padding:8px 16px;border-radius:20px;box-shadow:var(--shadow);white-space:nowrap;
}
#pickHint.show{display:block}
#pickHint{cursor:pointer}
@media (min-width:640px){
  .veil{align-items:center}
  .sheet{border-radius:28px;animation:none}
}
/* ── 몽글 테마: 둥글게 + 말랑 모션 ── */
button{transition:transform .16s var(--squish)}
button:active{transform:scale(.93)}
.sheet{border-radius:28px 28px 0 0}
.sheet input[type=text],.sheet input[type=date],.sheet input[type=search]{border-radius:16px;border-color:rgba(160,139,124,.28)}
.btn{border-radius:999px}
#fab{background:linear-gradient(135deg,#ff9fb0,#f26d85);box-shadow:0 10px 24px rgba(242,109,133,.45)}
nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(242,109,133,.13)}
nav button.active::after{width:34px;height:4px;border-radius:3px}
.leaflet-popup-content-wrapper{border-radius:18px}
.pol::before{background:rgba(255,183,197,.7)}
.pol img{border-radius:12px}
.pol .more{border-radius:999px;background:#ffe9ee}
.tl-card{border-radius:22px}
.tl-card img,.tl-card .noimg{border-radius:14px}
#tlStats span{border-radius:999px}
#toast{border-radius:999px;background:var(--rose-deep)}
#pickHint{border-radius:999px;background:var(--rose-deep)}
#bucketAdd input{border-radius:999px}
.bk-check{border-width:2.5px}
.bk-date{color:var(--sage)}
#photoRow .ph,#photoAdd{border-radius:14px}
#dPhotos img{border-radius:12px}
.heart-cluster{border-width:4px;font-family:var(--hand)}
.modal .close{border-radius:50%}
#searchResults li{border-bottom:1.5px dashed rgba(255,143,163,.35)}
#bucketList li{border-bottom:1.5px dashed rgba(255,143,163,.3)}
header h1{color:#6b4a52}
</style>
</head>
<body>

<header>
  <h1 id="names">우리<span class="amp">♥</span>지도</h1>
  <div id="dday"></div>
  <button id="btnSettings" aria-label="설정">⚙</button>
</header>

<main>
  <div class="pane active" id="paneMap">
    <div id="map"></div>
    <div id="pickHint">지도를 눌러 위치를 콕! (여기를 누르면 취소)</div>
  </div>
  <div class="pane" id="paneBucket">
    <div class="bucket-head">우리의 버킷리스트 <small id="bucketCount"></small></div>
    <ul id="bucketList"></ul>
    <div id="bucketEmpty">아직 비어있어요.<br>둘이 하고 싶은 걸 적어볼까요?</div>
  </div>
  <div class="pane" id="paneTimeline">
    <div id="tlStats"></div>
    <div id="tlList"></div>
    <div id="tlEmpty">아직 기록이 없어요.<br>지도에서 첫 추억을 남겨볼까요?</div>
  </div>
</main>

<div id="bucketAdd">
  <input id="bucketInput" type="text" maxlength="80" placeholder="예) 벚꽃 보러 가기, 첫 캠핑…">
  <button id="bucketSubmit" aria-label="추가">+</button>
</div>

<button id="fab" aria-label="장소 추가">+</button>

<nav>
  <button id="tabMap" class="active">🗺 지도</button>
  <button id="tabTimeline">📖 타임라인</button>
  <button id="tabBucket">📝 버킷리스트</button>
</nav>

<!-- add place: step1 search -->
<div class="veil" id="veilSearch">
  <div class="sheet">
    <h2>어디를 다녀왔나요?</h2>
    <input id="searchInput" type="search" placeholder="장소 이름 검색 (예: 남산타워)">
    <ul id="searchResults"></ul>
    <button class="btn btn-line" id="btnPickMap">🗺 지도에서 직접 위치 찍기</button>
    <button class="btn btn-ghost" id="btnSearchCancel">닫기</button>
  </div>
</div>

<!-- add place: step2 form -->
<div class="veil" id="veilForm">
  <div class="sheet">
    <h2 id="formTitle">추억 남기기</h2>
    <label>장소 이름</label>
    <input type="text" id="fName" maxlength="60" placeholder="우리만 아는 이름도 좋아요">
    <label>다녀온 날</label>
    <input type="date" id="fDate">
    <label>한 줄 기록</label>
    <input type="text" id="fNote" maxlength="120" placeholder="그날의 한 줄">
    <label>사진</label>
    <div id="photoRow"><button id="photoAdd">+</button></div>
    <input type="file" id="photoFile" accept="image/*" multiple hidden>
    <button class="btn btn-rose" id="btnSave">이 곳을 우리 지도에 ♥</button>
    <button class="btn btn-ghost" id="btnFormCancel">취소</button>
  </div>
</div>

<!-- settings -->
<div class="veil" id="veilSettings">
  <div class="sheet">
    <h2>우리 이야기 설정</h2>
    <label>내 이름</label><input type="text" id="sNameA" maxlength="12" placeholder="민재">
    <label>상대 이름</label><input type="text" id="sNameB" maxlength="12" placeholder="이름">
    <label>사귄 날 (D-day 기준)</label><input type="date" id="sStart">
    <button class="btn btn-rose" id="btnSettingsSave">저장</button>
    <button class="btn btn-line" id="btnExport">📤 데이터 백업 (파일 저장)</button>
    <button class="btn btn-line" id="btnImport">📥 백업 불러오기</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button class="btn btn-ghost" id="btnSettingsClose">닫기</button>
  </div>
</div>

<!-- place detail -->
<div class="modal" id="detail">
  <button class="close" id="dClose">✕</button>
  <h2 id="dTitle"></h2>
  <div id="dMeta"></div>
  <p id="dNote"></p>
  <div id="dPhotos"></div>
  <button id="dDelete">이 기록 지우기</button>
</div>

<div id="lightbox">
  <button id="lbPrev" aria-label="이전">‹</button>
  <img id="lightboxImg" alt="">
  <button id="lbNext" aria-label="다음">›</button>
  <div id="lbCount"></div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/dexie@3.2.7/dist/dexie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=32f3dd6b67ffcbb366a6d77b4d89552b&libraries=services&autoload=false"></script>
<script>
"use strict";
/* ───────── backend (Supabase) 설정 — backend/SETUP.md 절차 후 두 값만 채우면 커플 동기화 ON ───────── */
const SYNC = { url: "", key: "" };
/* ───────── state ───────── */
const LS_KEY = "cm_v1";
const $ = (id) => document.getElementById(id);
let db = load();
let lastGood = null;
function load() {
  const raw = localStorage.getItem(LS_KEY);
  try {
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.places) && Array.isArray(d.bucket)) { lastGood = raw; return d; }
    if (raw != null) throw 0;
  } catch (e) {
    // 깨진 데이터는 지우지 말고 복구 키에 보존
    try {
      if (raw != null && !localStorage.getItem(LS_KEY + "_recovery")) {
        localStorage.setItem(LS_KEY + "_recovery", raw);
        alert("이전 데이터를 읽지 못해 복구본으로 따로 보관해뒀어요.");
      }
    } catch (_) {}
  }
  return { meta: { a: "", b: "", start: "" }, places: [], bucket: [] };
}
function save(quiet) {
  const next = JSON.stringify(db);
  try {
    localStorage.setItem(LS_KEY, next);
    lastGood = next;
    return true;
  } catch (e) {
    if (lastGood !== null) db = JSON.parse(lastGood); // 메모리 상태를 마지막 정상 저장본으로 롤백
    if (quiet) { // 백그라운드(sync) 경로: alert 폭풍 방지, 1회만 토스트
      if (!save._warned) { save._warned = true; toast("저장 공간 부족 — 설정에서 백업 후 정리해주세요"); }
    } else {
      alert("저장 공간이 가득 찼어요 😢\n설정 → 백업으로 파일을 저장한 뒤, 오래된 사진 몇 장을 지워주세요.");
    }
    return false;
  }
}
/* 변경분만 서버로 밀기 위한 dirty 추적 */
function markDirty(kind, id) {
  try {
    const d = JSON.parse(localStorage.getItem("cm_dirty") || '{"places":[],"bucket":[],"meta":false}');
    if (kind === "meta") d.meta = true;
    else if (!d[kind].includes(id)) d[kind].push(id);
    localStorage.setItem("cm_dirty", JSON.stringify(d));
  } catch (e) {}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
/* 사진은 IndexedDB(Dexie)에 — localStorage 5MB 한계 해방. place.photos엔 사진 id만 */
const ddb = new Dexie("cm_photos");
ddb.version(1).stores({ photos: "id" });
const isDataImg = (s) => typeof s === "string" && /^data:image\//.test(s);
function makeThumb(dataURL) { // 팝업용 미니 썸네일 (localStorage에 보관)
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 320;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => res("");
    img.src = dataURL;
  });
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const fmtDate = (iso) => { if (!DATE_RE.test(iso || "")) return ""; const [y, m, d] = iso.split("-"); return `${y}. ${+m}. ${+d}.`; };
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
/* 오버레이 레이어 스택 + 안드로이드 뒤로가기 지원 */
const layers = [];
let historyArmed = false, ignorePop = false;
function openLayer(id) {
  $(id).classList.add("show");
  layers.push(id);
  if (!historyArmed) { history.pushState({ cm: 1 }, ""); historyArmed = true; }
}
function closeLayer(id) {
  const i = layers.lastIndexOf(id);
  if (i >= 0) layers.splice(i, 1);
  $(id).classList.remove("show");
  if (id === "veilForm") draft = null;
  if (!layers.length && historyArmed) { ignorePop = true; history.back(); historyArmed = false; }
}
window.addEventListener("popstate", () => {
  if (ignorePop) { ignorePop = false; return; }
  historyArmed = false;
  const id = layers.pop();
  if (id) { $(id).classList.remove("show"); if (id === "veilForm") draft = null; }
  if (layers.length) { history.pushState({ cm: 1 }, ""); historyArmed = true; }
});
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 2200); }

/* ───────── header / d-day ───────── */
function renderHeader() {
  const { a, b, start } = db.meta;
  $("names").innerHTML = a && b ? `${esc(a)}<span class="amp">♥</span>${esc(b)}` : `우리<span class="amp">♥</span>지도`;
  if (start) {
    const days = Math.floor((Date.now() - new Date(start + "T00:00:00")) / 864e5) + 1;
    $("dday").textContent = days > 0 ? `함께한 지 ${days.toLocaleString()}일` : "";
  } else $("dday").textContent = "";
}

/* ───────── map (Leaflet: 전세계 지도) + Kakao(국내 장소검색) ───────── */
const map = L.map("map", { zoomControl: false }).setView([36.5, 127.8], 7);
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  maxZoom: 20, attribution: '&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);
const pinLayer = (typeof L.markerClusterGroup === "function"
  ? L.markerClusterGroup({
      maxClusterRadius: 42, showCoverageOnHover: false,
      iconCreateFunction: (c) => L.divIcon({
        className: "", iconSize: [38, 38],
        html: `<div class="heart-cluster" style="width:38px;height:38px">♥${c.getChildCount()}</div>`,
      }),
    })
  : L.layerGroup()
).addTo(map);
const heartIcon = L.divIcon({
  className: "heart-pin", iconSize: [36, 34], iconAnchor: [18, 30], popupAnchor: [0, -26],
  html: `<svg viewBox="0 0 36 34" width="36" height="34"><path d="M18 31C9.5 24 4 18.6 4 12.6 4 7.8 7.8 4 12.4 4c2.3 0 4.4 1.1 5.6 2.9C19.2 5.1 21.3 4 23.6 4 28.2 4 32 7.8 32 12.6c0 6-5.5 11.4-14 18.4z" fill="#ff8fa3" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/><circle cx="12.2" cy="14.5" r="1.8" fill="#ffd1da"/><circle cx="23.8" cy="14.5" r="1.8" fill="#ffd1da"/></svg>`
});
let ps = null; // Kakao 장소검색 (지도 없이 검색만 사용)
try { kakao.maps.load(() => { ps = new kakao.maps.services.Places(); }); } catch (e) {}
function renderPins() {
  pinLayer.clearLayers();
  db.places.forEach((p) => {
    if (p.deleted || !Number.isFinite(+p.lat) || !Number.isFinite(+p.lng)) return;
    const m = L.marker([+p.lat, +p.lng], { icon: heartIcon }).addTo(pinLayer);
    const ph = isDataImg(p.thumb) ? p.thumb : (isDataImg(p.photos && p.photos[0]) ? p.photos[0] : "");
    const img = ph ? `<img src="${esc(ph)}" alt="">` : `<div class="noimg">🖼</div>`;
    m.bindPopup(
      `<div class="pol">${img}<h3>${esc(p.name)}</h3><time>${fmtDate(p.date)}</time>` +
      (p.note ? `<p>${esc(p.note)}</p>` : "") +
      `<button class="more" data-id="${esc(p.id)}">자세히 보기</button></div>`,
      { closeButton: false }
    );
  });
}
map.on("popupopen", (e) => {
  const btn = e.popup.getElement().querySelector(".more");
  if (btn) btn.onclick = () => openDetail(btn.dataset.id);
});
function fitPins() {
  const pts = db.places.filter((p) => !p.deleted && Number.isFinite(+p.lat) && Number.isFinite(+p.lng)).map((p) => [+p.lat, +p.lng]);
  if (!pts.length) return;
  map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 13 });
}

/* ───────── tabs ───────── */
function switchTab(which) {
  const T = { map: ["paneMap", "tabMap"], timeline: ["paneTimeline", "tabTimeline"], bucket: ["paneBucket", "tabBucket"] };
  for (const [k, [pane, tab]] of Object.entries(T)) {
    $(pane).classList.toggle("active", k === which);
    $(tab).classList.toggle("active", k === which);
  }
  $("bucketAdd").classList.toggle("show", which === "bucket");
  $("fab").style.display = which === "map" ? "" : "none";
  if (which === "map") setTimeout(() => map.invalidateSize(), 60);
  if (which === "timeline") renderTimeline();
}
$("tabMap").onclick = () => switchTab("map");
$("tabTimeline").onclick = () => switchTab("timeline");
$("tabBucket").onclick = () => switchTab("bucket");

/* ───────── timeline ───────── */
function renderTimeline() {
  const alive = db.places.filter((p) => !p.deleted);
  $("tlEmpty").style.display = alive.length ? "none" : "";
  const photoN = alive.reduce((n, p) => n + ((p.photos || []).length), 0);
  const doneN = db.bucket.filter((b) => !b.deleted && b.done).length;
  $("tlStats").innerHTML = alive.length
    ? `<span>함께 간 곳 <b>${alive.length}</b></span><span>사진 <b>${photoN}</b></span><span>이룬 버킷 <b>${doneN}</b></span>`
    : "";
  const sorted = [...alive].sort((a, b) => (b.date || "0000").localeCompare(a.date || "0000"));
  let lastYM = "", html = "";
  for (const p of sorted) {
    const ym = DATE_RE.test(p.date) ? `${p.date.slice(0, 4)}년 ${+p.date.slice(5, 7)}월` : "날짜 미정";
    if (ym !== lastYM) { html += `<div class="tl-month">${ym}</div>`; lastYM = ym; }
    const ph = isDataImg(p.thumb) ? `<img src="${esc(p.thumb)}" alt="">` : `<div class="noimg">🖼</div>`;
    html += `<div class="tl-card" data-id="${esc(p.id)}">${ph}<div><h3>${esc(p.name)}</h3><time>${fmtDate(p.date)}</time>` +
      (p.note ? `<p>${esc(p.note)}</p>` : "") + `</div></div>`;
  }
  $("tlList").innerHTML = html;
  [...$("tlList").querySelectorAll(".tl-card")].forEach((c) => (c.onclick = () => openDetail(c.dataset.id)));
}

/* ───────── add place flow ───────── */
let draft = null; // {lat,lng,name}
let picking = false;
$("fab").onclick = () => { openLayer("veilSearch"); $("searchInput").focus(); };
$("btnSearchCancel").onclick = () => closeLayer("veilSearch");

let searchTm = null;
$("searchInput").addEventListener("input", (e) => {
  clearTimeout(searchTm);
  const q = e.target.value.trim();
  if (q.length < 2) { $("searchResults").innerHTML = ""; return; }
  searchTm = setTimeout(() => doSearch(q), 450);
});
/* 검색: 카카오(국내 상호명 강력) 먼저 → 결과 없으면 전세계 검색(Nominatim) */
function showResults(items) { // items: [{name, addr, lat, lng}]
  if (!items.length) {
    $("searchResults").innerHTML = `<li><span>결과가 없어요 — 아래 '지도에서 직접 찍기'를 써보세요</span></li>`;
    return;
  }
  $("searchResults").innerHTML = items.map((x, i) =>
    `<li data-i="${i}"><b>${esc(x.name)}</b><span>${esc(x.addr)}</span></li>`
  ).join("");
  [...$("searchResults").children].forEach((li) => {
    li.onclick = () => {
      const x = items[+li.dataset.i];
      openForm({ lat: x.lat, lng: x.lng, name: x.name });
    };
  });
}
async function searchGlobal(q) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=ko&limit=6&q=${encodeURIComponent(q)}`);
    const rows = await r.json();
    showResults(rows.map((x) => ({
      name: x.display_name.split(",")[0],
      addr: x.display_name.split(",").slice(1, 4).join(","),
      lat: +x.lat, lng: +x.lon,
    })));
  } catch (e) {
    $("searchResults").innerHTML = `<li><span>검색 실패 — 인터넷 연결을 확인해주세요</span></li>`;
  }
}
function doSearch(q) {
  $("searchResults").innerHTML = `<li><span>찾는 중…</span></li>`;
  if (!ps) { void searchGlobal(q); return; }
  ps.keywordSearch(q, (rows, status) => {
    if (status === kakao.maps.services.Status.OK && rows.length) {
      showResults(rows.slice(0, 6).map((x) => ({
        name: x.place_name,
        addr: x.road_address_name || x.address_name || "",
        lat: +x.y, lng: +x.x,
      })));
    } else {
      void searchGlobal(q); // 해외 장소는 전세계 검색으로
    }
  });
}
function startPick() {
  picking = true;
  $("pickHint").classList.add("show");
  $("fab").style.display = "none";
  map.doubleClickZoom.disable();
}
function endPick() {
  picking = false;
  $("pickHint").classList.remove("show");
  $("fab").style.display = "";
  map.doubleClickZoom.enable();
}
$("btnPickMap").onclick = () => {
  closeLayer("veilSearch");
  switchTab("map");
  startPick();
};
$("pickHint").onclick = endPick; // 힌트 탭 = 취소
map.on("click", (e) => {
  if (!picking) return;
  endPick();
  openForm({ lat: e.latlng.lat, lng: e.latlng.lng, name: "" });
});

function openForm(d) {
  endPick();
  draft = { ...d, photos: [] };
  if (layers.includes("veilSearch")) closeLayer("veilSearch");
  $("fName").value = d.name || "";
  $("fDate").value = localToday();
  $("fNote").value = "";
  renderPhotoRow();
  openLayer("veilForm");
}
$("btnFormCancel").onclick = () => closeLayer("veilForm");

/* photos */
$("photoAdd").onclick = () => $("photoFile").click();
$("photoFile").addEventListener("change", async (e) => {
  const files = [...e.target.files].slice(0, 8);
  for (const f of files) {
    try { draft.photos.push({ id: uid(), data: await compress(f) }); } catch (err) { toast("사진 처리 실패"); }
  }
  e.target.value = "";
  renderPhotoRow();
});
function renderPhotoRow() {
  const row = $("photoRow");
  row.querySelectorAll(".ph").forEach((n) => n.remove());
  draft.photos.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "ph";
    d.innerHTML = `<img src="${p.data}" alt=""><button aria-label="삭제">✕</button>`;
    d.querySelector("button").onclick = () => { draft.photos.splice(i, 1); renderPhotoRow(); };
    row.insertBefore(d, $("photoAdd"));
  });
}
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1000;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = rej;
    img.src = url;
  });
}

$("btnSave").onclick = async () => {
  if ($("btnSave")._busy) return; // 더블탭 중복 저장 방지
  const name = $("fName").value.trim();
  if (!name) { toast("장소 이름을 적어주세요"); return; }
  $("btnSave")._busy = true;
  try {
    const { lat, lng } = draft;
    const photoIds = draft.photos.map((p) => p.id);
    let thumb = "";
    try {
      if (draft.photos.length) {
        await ddb.photos.bulkPut(draft.photos.map((p) => ({ id: p.id, data: p.data })));
        thumb = await makeThumb(draft.photos[0].data);
      }
    } catch (e) { toast("사진 저장 실패 — 다시 시도해주세요"); return; }
    const pid = uid();
    db.places.push({ id: pid, name, lat, lng, date: $("fDate").value, note: $("fNote").value.trim(), thumb, photos: photoIds, deleted: false, updated_at: Date.now() });
    if (!save()) { ddb.photos.bulkDelete(photoIds).catch(() => {}); renderAll(); return; }
    markDirty("places", pid);
    queuePhotoUpload(photoIds);
    closeLayer("veilForm");
    renderPins();
    map.setView([lat, lng], Math.max(map.getZoom(), 13));
    toast("우리 지도에 추가됐어요 ♥");
    requestSync();
  } finally { $("btnSave")._busy = false; }
};

/* ───────── detail ───────── */
let detailId = null;
async function openDetail(id) {
  const p = db.places.find((x) => x.id === id);
  if (!p) return;
  detailId = id;
  $("dTitle").textContent = p.name;
  $("dMeta").textContent = fmtDate(p.date);
  $("dNote").textContent = p.note || "";
  const ids = (p.photos || []).filter((s) => typeof s === "string");
  let srcs = ids.filter(isDataImg); // 구버전(사진이 통째로 들어있는 데이터) 호환
  const keyIds = ids.filter((s) => !isDataImg(s));
  if (keyIds.length) {
    try {
      const rows = await ddb.photos.bulkGet(keyIds);
      for (let i = 0; i < keyIds.length; i++) {
        const r = rows[i];
        if (r && isDataImg(r.data)) srcs.push(r.data);
        else { const remote = await fetchRemotePhoto(keyIds[i]); if (remote) srcs.push(remote); } // 상대가 올린 사진
      }
    } catch (e) {}
  }
  $("dPhotos").innerHTML = srcs.map((s) => `<img src="${esc(s)}" alt="">`).join("");
  [...$("dPhotos").children].forEach((im, i) => (im.onclick = () => openLightbox(srcs, i)));
  map.closePopup();
  openLayer("detail");
}
/* 사진 확대 — 좌우 넘기기(버튼·스와이프) */
let lbSrcs = [], lbIdx = 0;
function lbRender() {
  $("lightboxImg").src = lbSrcs[lbIdx] || "";
  $("lbCount").textContent = lbSrcs.length > 1 ? `${lbIdx + 1} / ${lbSrcs.length}` : "";
  $("lbPrev").classList.toggle("off", lbIdx === 0);
  $("lbNext").classList.toggle("off", lbIdx >= lbSrcs.length - 1);
}
function openLightbox(srcs, idx) { lbSrcs = srcs; lbIdx = idx; lbRender(); openLayer("lightbox"); }
$("lbPrev").onclick = (e) => { e.stopPropagation(); if (lbIdx > 0) { lbIdx--; lbRender(); } };
$("lbNext").onclick = (e) => { e.stopPropagation(); if (lbIdx < lbSrcs.length - 1) { lbIdx++; lbRender(); } };
$("lightboxImg").onclick = (e) => e.stopPropagation();
let lbTouchX = null;
$("lightbox").addEventListener("touchstart", (e) => { lbTouchX = e.touches[0].clientX; }, { passive: true });
$("lightbox").addEventListener("touchend", (e) => {
  if (lbTouchX == null) return;
  const dx = e.changedTouches[0].clientX - lbTouchX;
  lbTouchX = null;
  if (Math.abs(dx) < 40) return;
  if (dx < 0 && lbIdx < lbSrcs.length - 1) { lbIdx++; lbRender(); }
  else if (dx > 0 && lbIdx > 0) { lbIdx--; lbRender(); }
}, { passive: true });
$("dClose").onclick = () => closeLayer("detail");
$("lightbox").onclick = () => closeLayer("lightbox");
$("dDelete").onclick = () => {
  if (!confirm("이 추억을 정말 지울까요?")) return;
  const p = db.places.find((x) => x.id === detailId);
  if (p) { p.deleted = true; p.updated_at = Date.now(); } // tombstone — 상대 폰에도 삭제 전파
  if (!save()) { renderAll(); return; }
  if (p) markDirty("places", p.id);
  if (p) { // 다른 살아있는 추억이 참조하는 사진은 남김
    const used = new Set(db.places.filter((x) => !x.deleted).flatMap((x) => (x.photos || []).filter((s) => !isDataImg(s))));
    ddb.photos.bulkDelete((p.photos || []).filter((s) => !isDataImg(s) && !used.has(s))).catch(() => {});
  }
  renderPins();
  closeLayer("detail");
  toast("지웠어요");
  requestSync();
};

/* ───────── bucket ───────── */
function renderBucket() {
  const ul = $("bucketList");
  const items = db.bucket.filter((b) => !b.deleted);
  $("bucketEmpty").style.display = items.length ? "none" : "";
  $("bucketCount").textContent = items.length ? `${items.filter((b) => b.done).length}/${items.length} 이뤘어요` : "";
  ul.innerHTML = "";
  items.forEach((b) => {
    const li = document.createElement("li");
    li.className = b.done ? "done" : "";
    li.innerHTML =
      `<button class="bk-check ${b.done ? "done" : ""}" aria-label="완료">♥</button>` +
      `<div class="bk-body"><div class="bk-title">${esc(b.title)}</div>` +
      (b.done && b.doneDate ? `<div class="bk-date">${fmtDate(b.doneDate)} 함께 이룸 ♥</div>` : "") +
      `</div>` +
      (b.done ? `<button class="bk-pin" title="지도에 기록">📍</button>` : "") +
      `<button class="bk-del" aria-label="삭제">✕</button>`;
    li.querySelector(".bk-check").onclick = () => {
      b.done = !b.done;
      b.doneDate = b.done ? localToday() : "";
      b.updated_at = Date.now();
      const ok = save(); if (ok) markDirty("bucket", b.id);
      renderBucket(); requestSync();
      if (ok && b.done) {
        toast("하나 더 이뤘네요! 🎉");
        if (typeof confetti === "function") confetti({ particleCount: 90, spread: 70, origin: { y: 0.75 }, colors: ["#d95d6d", "#f7f1e5", "#7d9b76", "#ffffff"] });
      }
    };
    li.querySelector(".bk-del").onclick = () => {
      if (!confirm("이 항목을 지울까요?")) return;
      b.deleted = true; b.updated_at = Date.now(); // tombstone — 상대 폰에도 삭제 전파
      if (save()) markDirty("bucket", b.id);
      renderBucket(); requestSync();
    };
    const pin = li.querySelector(".bk-pin");
    if (pin) pin.onclick = () => { switchTab("map"); openLayer("veilSearch"); $("searchInput").value = b.title; doSearch(b.title); };
    ul.appendChild(li);
  });
}
function addBucket() {
  const v = $("bucketInput").value.trim();
  if (!v) return;
  const bid = uid();
  db.bucket.unshift({ id: bid, title: v, done: false, doneDate: "", deleted: false, updated_at: Date.now() });
  if (!save()) { renderBucket(); return; }
  markDirty("bucket", bid);
  $("bucketInput").value = "";
  renderBucket(); requestSync();
}
$("bucketSubmit").onclick = addBucket;
$("bucketInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addBucket(); });

/* ───────── settings ───────── */
$("btnSettings").onclick = () => {
  $("sNameA").value = db.meta.a; $("sNameB").value = db.meta.b; $("sStart").value = db.meta.start;
  openLayer("veilSettings");
};
$("btnSettingsClose").onclick = () => closeLayer("veilSettings");
$("btnSettingsSave").onclick = () => {
  db.meta = { a: $("sNameA").value.trim(), b: $("sNameB").value.trim(), start: $("sStart").value, updated_at: Date.now() };
  if (!save()) { renderHeader(); return; }
  markDirty("meta");
  renderHeader();
  closeLayer("veilSettings");
  toast("저장했어요");
  requestSync();
};
$("btnExport").onclick = async () => {
  // 사진(IndexedDB)까지 포함한 완전 백업 — 상대가 올려 내 폰에 없는 사진은 서버에서 받아옴
  const payload = { ...db, photoStore: {} };
  try {
    const ids = [...new Set(db.places.flatMap((p) => (p.photos || []).filter((s) => typeof s === "string" && !isDataImg(s))))];
    if (ids.length) {
      const rows = await ddb.photos.bulkGet(ids);
      for (let i = 0; i < ids.length; i++) {
        const r = rows[i];
        if (r && isDataImg(r.data)) payload.photoStore[ids[i]] = r.data;
        else { const remote = await fetchRemotePhoto(ids[i]); if (remote) payload.photoStore[ids[i]] = remote; }
      }
    }
  } catch (e) {}
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `우리의지도_백업_${localToday()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast("파일이 저장됐는지 꼭 확인해주세요");
};
$("btnImport").onclick = () => $("importFile").click();
$("importFile").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try {
      d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.places) || !Array.isArray(d.bucket)) throw 0;
    } catch (err) { alert("백업 파일이 아니에요"); return; }

    const before = JSON.stringify(db);
    const strOr = (v, fb) => (typeof v === "string" ? v : fb);
    const pids = new Set(db.places.map((p) => p.id));
    const bids = new Set(db.bucket.map((b) => b.id));
    const store = (d.photoStore && typeof d.photoStore === "object") ? d.photoStore : {};
    const photoQueue = []; // IndexedDB에 넣을 {id,data}
    // 레코드 단위 검증: 깨진 항목은 버리고, id 없으면 새로 부여
    for (const p of d.places) {
      if (!p || !Number.isFinite(+p.lat) || !Number.isFinite(+p.lng)) continue;
      const id = strOr(p.id, "") || uid();
      if (pids.has(id)) continue;
      pids.add(id);
      const photoIds = [];
      let firstData = "";
      (Array.isArray(p.photos) ? p.photos : []).forEach((s) => {
        if (isDataImg(s)) { // 구버전: 사진이 통째로 → 새 id 발급
          const phId = uid();
          photoQueue.push({ id: phId, data: s });
          photoIds.push(phId);
          if (!firstData) firstData = s;
        } else if (typeof s === "string" && s) { // 신버전: 원래 id 유지 (동기화 정체성 보존)
          photoIds.push(s);
          if (isDataImg(store[s])) {
            photoQueue.push({ id: s, data: store[s] });
            if (!firstData) firstData = store[s];
          } // 백업에 사진이 없어도 id는 남김 — 서버에서 받아올 수 있음
        }
      });
      let thumb = isDataImg(p.thumb) ? p.thumb : "";
      if (!thumb && firstData) { try { thumb = await makeThumb(firstData); } catch (e) {} }
      db.places.push({
        id,
        name: (strOr(p.name, "").trim() || "이름 없는 곳").slice(0, 60),
        lat: +p.lat, lng: +p.lng,
        date: DATE_RE.test(p.date) ? p.date : "",
        note: strOr(p.note, "").slice(0, 120),
        thumb,
        photos: photoIds,
        deleted: !!p.deleted,
        updated_at: Number(p.updated_at) || Date.now(),
      });
      markDirty("places", id);
      queuePhotoUpload(photoQueue.filter((q) => photoIds.includes(q.id)).map((q) => q.id));
    }
    d.bucket.forEach((b) => {
      if (!b) return;
      const title = strOr(b.title, "").trim().slice(0, 80);
      if (!title) return;
      const id = strOr(b.id, "") || uid();
      if (bids.has(id)) return;
      bids.add(id);
      db.bucket.push({ id, title, done: !!b.done, doneDate: DATE_RE.test(b.doneDate) ? b.doneDate : "", deleted: !!b.deleted, updated_at: Number(b.updated_at) || Date.now() });
      markDirty("bucket", id);
    });
    if (!db.meta.a && d.meta && typeof d.meta === "object") {
      db.meta = {
        a: strOr(d.meta.a, "").slice(0, 12),
        b: strOr(d.meta.b, "").slice(0, 12),
        start: DATE_RE.test(d.meta.start) ? d.meta.start : "",
      };
    }
    try { if (photoQueue.length) await ddb.photos.bulkPut(photoQueue); }
    catch (e) { db = JSON.parse(before); renderAll(); alert("사진 저장에 실패해서 불러오지 못했어요"); return; }
    if (!save()) {
      db = JSON.parse(before);
      ddb.photos.bulkDelete(photoQueue.map((p) => p.id)).catch(() => {});
      renderAll(); alert("공간이 부족해서 불러오지 못했어요 😢"); return;
    }
    renderAll();
    toast("불러왔어요 — 합쳐서 보관 중");
    requestSync();
  };
  r.readAsText(f);
  e.target.value = "";
});

/* veil 바깥 탭으로 닫기 (작성 중인 폼은 확인 후) */
["veilSearch", "veilSettings"].forEach((id) => {
  $(id).addEventListener("click", (e) => { if (e.target === $(id)) closeLayer(id); });
});
$("veilForm").addEventListener("click", (e) => {
  if (e.target !== $("veilForm")) return;
  const dirty = $("fName").value.trim() || $("fNote").value.trim() || (draft && draft.photos.length);
  if (!dirty || confirm("작성 중인 기록을 버릴까요?")) closeLayer("veilForm");
});

/* ───────── backend sync (Supabase) — SYNC.url/key 채우면 자동 활성 ───────── */
let sb = null, syncing = false, syncDebounce = null;
const syncOn = () => !!(SYNC.url && SYNC.key && window.supabase);
function requestSync() { // 저장 직후 3초 디바운스 푸시
  if (!syncOn()) return;
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(() => void syncNow(), 3000);
}
function queuePhotoUpload(ids) {
  if (!ids.length) return;
  try {
    const q = JSON.parse(localStorage.getItem("cm_upq") || "[]");
    localStorage.setItem("cm_upq", JSON.stringify([...new Set([...q, ...ids])]));
  } catch (e) { toast("사진 업로드 예약 실패"); }
}
async function flushPhotoUploads() {
  const q = JSON.parse(localStorage.getItem("cm_upq") || "[]");
  if (!q.length) return;
  const done = new Set();
  const liveRefs = new Set(db.places.filter((p) => !p.deleted).flatMap((p) => (p.photos || []).filter((s) => !isDataImg(s))));
  for (const id of q) {
    try {
      const row = await ddb.photos.get(id);
      if (!row || !isDataImg(row.data)) {
        if (!liveRefs.has(id)) done.add(id); // 아무도 안 쓰는 id만 버림. 참조 중이면 보존(복구 기회)
        continue;
      }
      const blob = await (await fetch(row.data)).blob();
      const { error } = await sb.storage.from("photos").upload(`${id}.jpg`, blob, { upsert: true, contentType: "image/jpeg" });
      if (!error) done.add(id);
    } catch (e) {}
  }
  // 재읽기 후 성공분만 제거 — 업로드 중 새로 큐된 id 보존 (경합 방지)
  try {
    const cur = JSON.parse(localStorage.getItem("cm_upq") || "[]");
    localStorage.setItem("cm_upq", JSON.stringify(cur.filter((id) => !done.has(id))));
  } catch (e) {}
}
function mergeLWW(localArr, remoteRows, normalize) {
  // last-write-wins by updated_at. 동률+내용 다름 → 원격 승(수렴 보장)
  let changed = false;
  const byId = new Map(localArr.map((x) => [x.id, x]));
  for (const raw of remoteRows) {
    const r = normalize(raw);
    if (!r) continue;
    const l = byId.get(r.id);
    if (!l) { localArr.push(r); byId.set(r.id, r); changed = true; continue; }
    const rt = r.updated_at || 0, lt = l.updated_at || 0;
    if (rt > lt) { Object.assign(l, r); changed = true; }
    else if (rt === lt) {
      const keys = Object.keys(r).filter((k) => k !== "updated_at");
      if (!keys.every((k) => JSON.stringify(l[k]) === JSON.stringify(r[k]))) { Object.assign(l, r); changed = true; }
    }
  }
  return changed;
}
let syncPending = false;
async function syncNow() {
  if (!syncOn()) return;
  if (syncing) { syncPending = true; return; }
  syncing = true;
  try {
    if (!sb) sb = window.supabase.createClient(SYNC.url, SYNC.key);
    // 1) pull + merge (LWW)
    const [pr, br, mr] = await Promise.all([
      sb.from("places").select("*"), sb.from("bucket").select("*"),
      sb.from("meta").select("*").eq("id", "meta").maybeSingle(),
    ]);
    if (pr.error || br.error) return; // pull 실패 시 push 금지 (낡은 상태로 서버 덮어쓰기 방지)
    let changed = false;
    changed = mergeLWW(db.places, pr.data || [], (r) => {
      if (typeof r.id !== "string" || !Number.isFinite(+r.lat) || !Number.isFinite(+r.lng)) return null;
      return {
        id: r.id, name: String(r.name || "").slice(0, 60), lat: +r.lat, lng: +r.lng,
        date: DATE_RE.test(r.date) ? r.date : "", note: String(r.note || "").slice(0, 120),
        thumb: isDataImg(r.thumb) ? r.thumb : "",
        photos: (Array.isArray(r.photos) ? r.photos : []).filter((s) => typeof s === "string"),
        deleted: !!r.deleted, updated_at: Number(r.updated_at) || 0,
      };
    }) || changed;
    changed = mergeLWW(db.bucket, br.data || [], (r) => {
      if (typeof r.id !== "string" || typeof r.title !== "string" || !r.title) return null;
      return {
        id: r.id, title: r.title.slice(0, 80), done: !!r.done,
        doneDate: DATE_RE.test(r.done_date) ? r.done_date : "",
        deleted: !!r.deleted, updated_at: Number(r.updated_at) || 0,
      };
    }) || changed;
    if (!mr.error && mr.data && (Number(mr.data.updated_at) || 0) > (db.meta.updated_at || 0)) {
      db.meta = {
        a: String(mr.data.a || "").slice(0, 12), b: String(mr.data.b || "").slice(0, 12),
        start: DATE_RE.test(mr.data.start) ? mr.data.start : "",
        updated_at: Number(mr.data.updated_at) || 0,
      };
      changed = true; renderHeader();
    }
    if (changed && !save(true)) return; // 저장 실패(용량) → 롤백된 낡은 상태를 밀지 않음
    if (changed) renderAll();
    // 2) push — 내 기기에서 바뀐 것만 (dirty)
    const dirty = JSON.parse(localStorage.getItem("cm_dirty") || '{"places":[],"bucket":[],"meta":false}');
    const pushP = db.places.filter((p) => dirty.places.includes(p.id));
    const pushB = db.bucket.filter((b) => dirty.bucket.includes(b.id));
    const jobs = [];
    if (pushP.length) jobs.push(sb.from("places").upsert(pushP.map((p) => ({
      id: p.id, name: p.name, lat: p.lat, lng: p.lng, date: p.date || "", note: p.note || "",
      thumb: p.thumb || "", photos: (p.photos || []).filter((s) => !isDataImg(s)),
      deleted: !!p.deleted, updated_at: p.updated_at || 0,
    }))));
    if (pushB.length) jobs.push(sb.from("bucket").upsert(pushB.map((b) => ({
      id: b.id, title: b.title, done: !!b.done, done_date: b.doneDate || "",
      deleted: !!b.deleted, updated_at: b.updated_at || 0,
    }))));
    if (dirty.meta) jobs.push(sb.from("meta").upsert({
      id: "meta", a: db.meta.a || "", b: db.meta.b || "", start: db.meta.start || "",
      updated_at: db.meta.updated_at || 0,
    }));
    const results = await Promise.all(jobs);
    if (results.every((r) => !r.error)) {
      // 성공분만 dirty에서 제거 (푸시 중 새로 dirty된 것은 보존)
      try {
        const cur = JSON.parse(localStorage.getItem("cm_dirty") || '{"places":[],"bucket":[],"meta":false}');
        const pushedP = new Set(pushP.map((p) => p.id)), pushedB = new Set(pushB.map((b) => b.id));
        cur.places = cur.places.filter((id) => !pushedP.has(id));
        cur.bucket = cur.bucket.filter((id) => !pushedB.has(id));
        if (dirty.meta) cur.meta = false;
        localStorage.setItem("cm_dirty", JSON.stringify(cur));
      } catch (e) {}
    }
    // 3) 사진 업로드 큐 처리
    await flushPhotoUploads();
  } catch (e) { console.warn("sync fail", e); }
  finally {
    syncing = false;
    if (syncPending) { syncPending = false; void syncNow(); }
  }
}
async function fetchRemotePhoto(id) { // 상대가 올린 사진을 내 폰에 캐시
  if (!syncOn() || !sb) return "";
  try {
    const { data, error } = await sb.storage.from("photos").download(`${id}.jpg`);
    if (error || !data) return "";
    const dataURL = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(data); });
    if (isDataImg(dataURL)) { await ddb.photos.put({ id, data: dataURL }); return dataURL; }
  } catch (e) {}
  return "";
}
if (syncOn()) { void syncNow(); setInterval(() => void syncNow(), 60000); }

/* ───────── boot ───────── */
function renderAll() {
  renderHeader(); renderPins(); renderBucket(); fitPins();
  if ($("paneTimeline").classList.contains("active")) renderTimeline();
}
try { renderAll(); } catch (e) { console.error(e); toast("일부 데이터를 표시하지 못했어요"); }
/* 구버전 데이터 이관: localStorage에 통째로 든 사진 → IndexedDB (용량 해방) */
(async function migratePhotos() {
  const olds = db.places.filter((p) => (p.photos || []).some(isDataImg));
  if (!olds.length) return;
  for (const p of olds) {
    const ids = [], queue = [];
    for (const s of p.photos) {
      if (isDataImg(s)) { const id = uid(); queue.push({ id, data: s }); ids.push(id); }
      else if (typeof s === "string") ids.push(s);
    }
    try { await ddb.photos.bulkPut(queue); } catch (e) { return; } // 실패 시 원본 유지
    if (!isDataImg(p.thumb) && queue[0]) { try { p.thumb = await makeThumb(queue[0].data); } catch (e) {} }
    p.photos = ids;
    p.updated_at = Date.now(); // 상대 폰이 새 photo id를 받아가도록
    markDirty("places", p.id);
    queuePhotoUpload(queue.map((q) => q.id));
  }
  if (save()) { renderPins(); requestSync(); }
})();
/* 브라우저가 사진 저장소(IndexedDB)를 함부로 비우지 않게 요청 */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
/* 앱 나갈 때 못 보낸 변경분 밀어보기 */
addEventListener("pagehide", () => { if (syncOn()) void syncNow(); });
if (!db.meta.start && !db.places.length && !db.bucket.length) {
  setTimeout(() => openLayer("veilSettings"), 700);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
